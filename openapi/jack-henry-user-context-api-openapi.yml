openapi: 3.2.0
info:
  title: Banno Plugin Framework User Context API
  description: 'The Plugin Framework lets partners build custom cards that appear in

    a user''s Banno Online and Mobile dashboard.'
  version: v0
servers:
- url: https://digital.garden.banno-uat.com
  description: Banno UAT
- url: https://digital.banno.com
  description: Banno production
tags:
- name: User Context
  description: Authenticated user/account context surfaced to a plugin.
paths:
  /plugins/api/v0/context:
    get:
      summary: Get Plugin User Context
      operationId: getPluginUserContext
      tags:
      - User Context
      description: 'Returns the authenticated user/account context the host hands the

        plugin (institution ID, user ID, environment, locale). Subject to

        the plugin''s authorized scopes in Banno People.'
      responses:
        '200':
          description: Plugin context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginContext'
components:
  schemas:
    PluginContext:
      type: object
      properties:
        institutionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        environment:
          type: string
          enum:
          - UAT
          - Production
        locale:
          type: string
          example: en-US
        bridgeVersion:
          type: string
